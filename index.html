
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Uma pergunta para você ♡</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
  background: #eee5d9;
  color: #60483d;
  font-family: Georgia, serif;
  text-align: center;
}

.card {
  width: 100%;
  max-width: 430px;
  padding: 38px 24px;
  border-radius: 25px;
  background: #faf6ef;
  box-shadow: 0 15px 45px #6b4c351c;
  border: 1px solid #dfcdb9;
}

.heart { font-size: 48px; }

h1 {
  font-size: 30px;
  line-height: 1.3;
  font-weight: normal;
}

p {
  font-size: 18px;
  line-height: 1.7;
}

button {
  border: none;
  border-radius: 30px;
  padding: 14px 25px;
  margin: 8px;
  font-size: 16px;
  cursor: pointer;
  font-family: Arial, sans-serif;
}

.primary {
  background: #a96f55;
  color: white;
}

.secondary {
  background: #e9ded1;
  color: #60483d;
}

.hidden { display: none; }

.photo {
  display: block;
  width: 100%;
  max-height: 400px;
  object-fit: contain;
  border: 8px solid white;
  box-shadow: 0 5px 20px #60483d22;
  border-radius: 5px;
  margin: 18px auto 0;
}
</style>
</head>

<body>
<main class="card">

  <section id="inicio">
    <div class="heart">♡</div>
    <h1>Tenho uma pergunta para você...</h1>
    <p>Preparei uma coisinha especial. 🌷</p>
    <button class="primary" onclick="continuar()">
      Continuar ♡
    </button>
  </section>

  <section id="pergunta" class="hidden">
    <div class="heart">🤎</div>
    <h1>Você quer namorar comigo?</h1>
    <p>Escolha com carinho...</p>
    <button class="primary" onclick="aceitou()">SIM ♡</button>
    <button class="secondary" id="no">NÃO 🙈</button>
  </section>

  <section id="sim" class="hidden">
    <div class="heart">♡</div>
    <h1>Você disse SIM!</h1>
    <p>Seu sorriso ilumina meu dia. ♡</p>
    <p>Preparei uma surpresa para você!</p>
    <button class="primary" onclick="surpresa()">
      Ver surpresa ✨
    </button>
  </section>

  <section id="final" class="hidden">
    <div class="heart">🤎</div>
    <h1>Um pedacinho do meu coração</h1>
    <p>Que seja sempre nós! ♡</p>

    <img class="photo" src="./foto.jpg"
         alt="Uma foto especial">

    <p>Com carinho, para você. 🌷</p>
  </section>

</main>

<script>
function mostrar(id) {
  document.querySelectorAll('main section').forEach(s => {
    s.classList.add('hidden');
  });

  document.getElementById(id).classList.remove('hidden');
}

function continuar() {
  mostrar('pergunta');
}

function aceitou() {
  mostrar('sim');
}

function surpresa() {
  mostrar('final');
}

const nao = document.getElementById('no');

function fugir() {
  const margem = 15;
  const largura = nao.offsetWidth;
  const altura = nao.offsetHeight;

  nao.style.position = 'fixed';
  nao.style.left = Math.max(
    margem,
    Math.random() * (window.innerWidth - largura - margem)
  ) + 'px';

  nao.style.top = Math.max(
    margem,
    Math.random() * (window.innerHeight - altura - margem)
  ) + 'px';
}

nao.addEventListener('pointerenter', fugir);
nao.addEventListener('click', fugir);

nao.addEventListener('touchstart', function(e) {
  e.preventDefault();
  fugir();
}, { passive: false });
</script>

</body>
</html>
